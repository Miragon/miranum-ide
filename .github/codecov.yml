# CI uploads coverage only for the Vitest targets a commit touches, so carry
# every other flag forward; otherwise project totals swing between commits.
flag_management:
  default_rules:
    carryforward: true

coverage:
  status:
    # Path-filtered uploads would block unrelated PRs if these were required;
    # the per-workspace Vitest thresholds are the enforced gate.
    project:
      default:
        informational: true
    patch:
      default:
        informational: true

comment:
  show_carryforward_flags: true
