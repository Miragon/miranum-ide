version: 2
updates:
  # Fetch and update latest `npm` packages
  - package-ecosystem: npm
    directory: "/"
    target-branch: "main"
    labels:
      - "Technical Dept"
    schedule:
      interval: weekly
      time: "05:00"
    commit-message:
      prefix: chore
      prefix-development: chore
      include: scope
    cooldown:
      default-days: 5
      semver-major-days: 14
      semver-minor-days: 5
      semver-patch-days: 3
    ignore:
      # The Theia shell pins its Electron runtime; move electron with @theia/*.
      - dependency-name: "electron"
        update-types:
          - "version-update:semver-major"
      # vitepress-plugin-mermaid only accepts mermaid ^10 || ^11.
      - dependency-name: "mermaid"
        update-types:
          - "version-update:semver-major"
      # @bpmn-io/diagram-js-ui and form-js still require preact ^10; the root
      # resolution pins 10.x, so a workspace-only major bump ships untested.
      - dependency-name: "preact"
        update-types:
          - "version-update:semver-major"
    groups:
      # bpmnlint must move in lockstep with the bundled resolver in
      # @miragon/bpmnlint-plugin-rules.
      bpmnlint:
        applies-to: version-updates
        patterns:
          - "bpmnlint"
          - "@miragon/bpmnlint-plugin-rules"
      # Not split by update type: a dependent's major (form-js) can add a range
      # that Yarn resolves to a newer minor of a single-version package
      # (@bpmn-io/properties-panel) than the workspaces pin. yarn dedupe only
      # moves ranges upward, so the pin bump has to land in the same PR.
      bpmn-io:
        applies-to: version-updates
        patterns:
          - "@bpmn-io/*"
          - "bpmn-js*"
          - "camunda-*"
          - "diagram-js*"
          - "dmn-js*"
          - "*-moddle"
      npm-minor-patch:
        applies-to: version-updates
        update-types:
          - minor
          - patch
        patterns:
          - "*"
      npm-major:
        applies-to: version-updates
        update-types:
          - major
        patterns:
          - "*"
  # Fetch and update latest `github-actions` packages
  - package-ecosystem: github-actions
    # The composite actions pin their own action SHAs.
    directories:
      - "/"
      - "/.github/actions/*"
    schedule:
      interval: weekly
      time: "05:00"
    target-branch: "main"
    labels:
      - "Technical Dept"
    commit-message:
      prefix: chore
      prefix-development: chore
      include: scope
    groups:
      github-actions-all:
        patterns:
          - "*"
  # Fetch and update latest `gradle` packages (IntelliJ plugin module).
  - package-ecosystem: gradle
    directory: "/apps/intellij-plugin"
    target-branch: "main"
    labels:
      - "Technical Dept"
    schedule:
      interval: weekly
      time: "05:00"
    commit-message:
      prefix: chore
      prefix-development: chore
      include: scope
    cooldown:
      default-days: 5
      semver-major-days: 14
      semver-minor-days: 5
      semver-patch-days: 3
    groups:
      gradle-minor-patch:
        applies-to: version-updates
        update-types:
          - minor
          - patch
        patterns:
          - "*"
      gradle-major:
        applies-to: version-updates
        update-types:
          - major
        patterns:
          - "*"
