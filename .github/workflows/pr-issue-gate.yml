name: PR Issue Gate

# Enforces the acceptance gate on PRs (see CONTRIBUTING → The Acceptance Gate):
#   1. the PR must link an issue — closing (`Closes #N`) or not (`Part of #N`,
#      `Refs #N`), so a PR delivering part of an issue can link it, and
#   2. that issue must already be `accepted`.
# Until then the PR is labelled `blocked: awaiting-acceptance` and put on hold.
#
# `pull_request_target` (not `pull_request`) so the token can label/comment on
# PRs from forks. We never check out PR head code here — only the GitHub API is
# used — so running in the base context is safe.

on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read
  issues: read
  pull-requests: write

concurrency:
  group: pr-issue-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  linked-issue:
    name: PR links an issue
    runs-on: ubuntu-latest
    outputs:
      issues: ${{ steps.resolve.outputs.issues }}
    steps:
      - id: resolve
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v7.0.1
        with:
          script: |
            const { owner, repo } = context.repo;
            const pr = context.payload.pull_request;
            const prNumber = pr.number;
            const MARKER = '<!-- pr-issue-gate:no-linked-issue -->';

            const headRef = pr.head.ref || '';
            const prLabels = (pr.labels || []).map(l => l.name);
            const skip =
              prLabels.includes('no-issue') ||
              headRef.startsWith('dependabot/') ||
              headRef.startsWith('release-please--');

            const linkedLabelsByNumber = new Map();
            if (!skip) {
              const { repository } = await github.graphql(`
                query($owner:String!,$repo:String!,$number:Int!){
                  repository(owner:$owner,name:$repo){
                    pullRequest(number:$number){
                      closingIssuesReferences(first:20){
                        nodes { number labels(first:50){ nodes { name } } }
                      }
                    }
                  }
                }`, { owner, repo, number: prNumber });
              for (const issue of repository.pullRequest.closingIssuesReferences.nodes) {
                linkedLabelsByNumber.set(issue.number, issue.labels.nodes.map(l => l.name));
              }

              // GitHub only resolves closing keywords on PRs into the default
              // branch, and never resolves non-closing ones, so stacked and
              // partial PRs are matched from the body.
              const ISSUE_REFERENCE =
                /\b(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?|part of|refs?|references|relate[sd] to)\s*:?\s+#(\d+)\b/gi;
              for (const [, referencedNumber] of (pr.body || '').matchAll(ISSUE_REFERENCE)) {
                const issueNumber = Number(referencedNumber);
                if (linkedLabelsByNumber.has(issueNumber)) continue;
                const issue = await github.rest.issues
                  .get({ owner, repo, issue_number: issueNumber })
                  .then(response => response.data, () => null);
                if (issue && !issue.pull_request) {
                  linkedLabelsByNumber.set(issueNumber,
                    issue.labels.map(l => (typeof l === 'string' ? l : l.name)));
                }
              }
            }

            const linked = [...linkedLabelsByNumber]
              .map(([number, labels]) => ({ number, labels }));
            core.setOutput('issues', JSON.stringify(linked));

            const { data: comments } = await github.rest.issues.listComments({
              owner, repo, issue_number: prNumber, per_page: 100,
            });
            const noLinkComment = comments.find(c => c.body.includes(MARKER));

            if (skip || linked.length > 0) {
              if (noLinkComment) {
                await github.rest.issues.deleteComment({
                  owner, repo, comment_id: noLinkComment.id,
                });
              }
              return;
            }

            if (!noLinkComment) {
              await github.rest.issues.createComment({
                owner, repo, issue_number: prNumber,
                body: [
                  MARKER,
                  `No linked issue found. Reference the issue in the PR description: \`Closes #123\` when this PR completes it, or \`Part of #123\` / \`Refs #123\` when it delivers only part of it. For a trivial fix with nothing to discuss, add the \`no-issue\` label. See [The Acceptance Gate](https://github.com/${owner}/${repo}/blob/main/CONTRIBUTING.md#the-acceptance-gate-triage).`,
                ].join('\n'),
              });
            }
            core.setFailed('No linked issue found in the PR description.');

  acceptance-gate:
    name: Linked issue is accepted
    needs: linked-issue
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v7.0.1
        env:
          LINKED_ISSUES: ${{ needs.linked-issue.outputs.issues }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const pr = context.payload.pull_request;
            const prNumber = pr.number;
            const BLOCKED = 'blocked: awaiting-acceptance';
            const MARKER = '<!-- pr-issue-gate -->';

            const linked = JSON.parse(process.env.LINKED_ISSUES || '[]');
            // Empty only for exempt PRs; unlinked ones already failed linked-issue.
            if (linked.length === 0) return;

            const accepted = linked.some(i => i.labels.includes('accepted'));

            const prLabels = (pr.labels || []).map(l => l.name);
            const hasBlockedLabel = prLabels.includes(BLOCKED);

            if (accepted) {
              if (hasBlockedLabel) {
                await github.rest.issues.removeLabel({
                  owner, repo, issue_number: prNumber, name: BLOCKED,
                }).catch(() => {});
              }
              return;
            }

            if (!hasBlockedLabel) {
              await github.rest.issues.addLabels({
                owner, repo, issue_number: prNumber, labels: [BLOCKED],
              });
            }

            const { data: comments } = await github.rest.issues.listComments({
              owner, repo, issue_number: prNumber, per_page: 100,
            });
            const already = comments.some(c => c.body.includes(MARKER));
            if (already) return;

            const refs = linked.map(i => `#${i.number}`).join(', ');
            await github.rest.issues.createComment({
              owner, repo, issue_number: prNumber,
              body: [
                MARKER,
                `⏸️ **Review on hold.** The linked issue (${refs}) hasn't been \`accepted\` yet.`,
                ``,
                `We review the *idea* before the implementation, so this PR waits until a maintainer accepts the issue. Once it's accepted this label clears automatically. See [The Acceptance Gate](https://github.com/${owner}/${repo}/blob/main/CONTRIBUTING.md#the-acceptance-gate-triage).`,
              ].join('\n'),
            });
